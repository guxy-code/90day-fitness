name: Test production build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test
        run: npm test
      - name: Build installable offline app
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Browser acceptance tests
        run: |
          node scripts/serve.mjs --dir dist > /tmp/90day-fitness-server.log 2>&1 &
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent http://localhost:4173/90day-fitness/ > /dev/null
          python tests/e2e.py
      - name: Upload browser reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: production-dist
          path: dist
